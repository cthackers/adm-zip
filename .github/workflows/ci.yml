name: Linux build

on:
  push:
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The library itself supports Node >= 14 (see package.json engines), but
        # the test tooling (mocha 12 / chai 6) requires Node ^20.19 || >=22.12,
        # so the suite is only run on those versions.
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: |
          npm install

      - name: Run Tests
        run: |
          npm test
